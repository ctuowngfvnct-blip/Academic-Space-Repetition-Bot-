# fly.toml app configuration file generated for srbot-ctuowngf on 2026-08-07T17:25:41+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'srbot-ctuowngf'
primary_region = 'sin'

[build]
[env]
  DB_PATH = '/data/srbot.db'

[[mounts]]
  source = 'srbot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
